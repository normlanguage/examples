name: Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.26
      - name: Verify package behavior
        run: node scripts/verify.mjs
      - name: Verify process observation
        run: node --test scripts/command.test.mjs scripts/observe-process.test.mjs scripts/verify-native-web.test.mjs

      - name: Verify native applications
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/verify.mjs --native
